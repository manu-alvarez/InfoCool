name: InfoCool dependency lock repair

on:
  push:
    branches: [ci/verify-infocol-20261123]
    paths: [.github/workflows/dependency-repair.yml, frontend/next.config.ts]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-infocol-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic lockfile and compile
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm ci
          npm run build
      - name: Commit tested lockfile update to branch
        run: |
          set -euo pipefail
          git add frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): lock missing InfoCool frontend dependencies'
          git push origin HEAD:ci/verify-infocol-20261123
